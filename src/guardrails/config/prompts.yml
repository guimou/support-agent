# Nemotron Content Safety prompt templates
# Task names must match NeMo's content_safety action key format:
#   content_safety_check_input $model=content_safety
#   content_safety_check_output $model=content_safety
#
# Uses a curated subset of NVIDIA's 23-category safety taxonomy,
# filtered to categories relevant for a platform support assistant.
# Off-topic and jailbreak detection are handled separately by the
# topic classifier (rails.py) and regex flows.

prompts:
  - task: content_safety_check_input $model=content_safety
    content: |
      Task: Check if there is unsafe content in the user or agent messages in the below conversation in accordance with our safety policy with the below categories.
      Provide a 'safe' or 'unsafe' rating for both the user message and the agent response.
      If there is unsafe content, please also provide a list of violated categories according to our safety policy below.

      <BEGIN UNSAFE CONTENT CATEGORIES>
      S1: Violence.
      S3: Criminal Planning/Confessions.
      S4: Guns and Illegal Weapons.
      S6: Suicide and Self Harm.
      S7: Sexual (minor).
      S8: Hate/Identity Hate.
      S9: PII/Privacy.
      S15: Manipulation.
      S16: Fraud/Deception.
      S17: Malware.
      <END UNSAFE CONTENT CATEGORIES>

      <BEGIN CONVERSATION>
      user: {{ user_input }}
      <END CONVERSATION>

      Provide your safety assessment for the above conversation in the below output JSON format:
      {"User Safety": safe or unsafe rating for the user message, "Response Safety": safe or unsafe rating for the agent response. Omit if no agent response present. "Safety Categories": a comma-separated list of applicable safety categories from the provided taxonomy. Omit if all safe.}
      Do not include anything other than the output JSON in your response.
      Output JSON:
    output_parser: nemoguard_parse_prompt_safety
    max_tokens: 100

  - task: content_safety_check_output $model=content_safety
    content: |
      Task: Check if there is unsafe content in the user or agent messages in the below conversation in accordance with our safety policy with the below categories.

      <BEGIN UNSAFE CONTENT CATEGORIES>
      S1: Violence.
      S7: Sexual (minor).
      S8: Hate/Identity Hate.
      S9: PII/Privacy.
      S16: Fraud/Deception.
      S17: Malware.
      <END UNSAFE CONTENT CATEGORIES>

      Assess the safety of both the user message and the agent response. Always output a JSON object with both "User Safety" and "Response Safety" fields.

      Examples:

      <BEGIN CONVERSATION>
      user: How do I check my API usage?
      agent: You can check your API usage in the LiteMaaS dashboard under Settings > Usage.
      <END CONVERSATION>
      Output: {"User Safety": "safe", "Response Safety": "safe"}

      <BEGIN CONVERSATION>
      user: I want to hurt someone
      agent: I'm sorry, I can't help with that.
      <END CONVERSATION>
      Output: {"User Safety": "unsafe", "Response Safety": "safe", "Safety Categories": "S1"}

      Now assess the following conversation:

      <BEGIN CONVERSATION>
      user: {{ user_input }}
      agent: {{ bot_response }}
      <END CONVERSATION>
      Output:
    output_parser: nemoguard_parse_response_safety
    max_tokens: 100
